components:
  schemas:
    ApproveIn:
      properties:
        run_id:
          type: string
          title: Run Id
        reason:
          type: string
          maxLength: 2000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - run_id
      - reason
      title: ApproveIn
    Attempt:
      properties:
        action:
          type: string
          enum:
          - refund_order
          - request_return
          - request_verification
          - answer
          title: Action
        answer:
          type: string
          title: Answer
        arguments:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Arguments
      additionalProperties: false
      type: object
      required:
      - action
      - answer
      title: Attempt
    Audio:
      properties:
        audio_id:
          type: string
          title: Audio Id
        audio_url:
          type: string
          title: Audio Url
        transcript:
          type: string
          title: Transcript
        cached:
          type: boolean
          title: Cached
      additionalProperties: false
      type: object
      required:
      - audio_id
      - audio_url
      - transcript
      - cached
      title: Audio
    AudioIn:
      properties:
        side:
          type: string
          enum:
          - baseline
          - candidate
          title: Side
        repetition:
          type: integer
          enum:
          - 1
          - 2
          title: Repetition
      additionalProperties: false
      type: object
      required:
      - side
      - repetition
      title: AudioIn
    Body_upload_api_sources_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_api_sources_post
    Candidate:
      properties:
        candidate_id:
          type: string
          title: Candidate Id
        created_at:
          type: string
          title: Created At
        source_id:
          type: string
          title: Source Id
        text:
          type: string
          title: Text
        scope:
          $ref: '#/components/schemas/Scope'
        parent_candidate_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Candidate Id
        base_version_id:
          type: string
          title: Base Version Id
        content_hash:
          type: string
          title: Content Hash
        status:
          type: string
          enum:
          - staged
          - testing
          - eligible
          - quarantined
          - inconclusive
          - approved
          title: Status
        latest_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Run Id
      additionalProperties: false
      type: object
      required:
      - candidate_id
      - created_at
      - source_id
      - text
      - scope
      - parent_candidate_id
      - base_version_id
      - content_hash
      - status
      title: Candidate
    CandidateIn:
      properties:
        source_id:
          type: string
          title: Source Id
        text:
          type: string
          maxLength: 8000
          minLength: 1
          title: Text
        scope:
          $ref: '#/components/schemas/Scope'
        base_version_id:
          type: string
          title: Base Version Id
      additionalProperties: false
      type: object
      required:
      - source_id
      - text
      - scope
      - base_version_id
      title: CandidateIn
    CandidateList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Candidate'
          type: array
          title: Items
        truncated:
          type: boolean
          title: Truncated
      additionalProperties: false
      type: object
      required:
      - items
      - truncated
      title: CandidateList
    CaseEvidence:
      properties:
        case_id:
          type: string
          title: Case Id
        classification:
          type: string
          enum:
          - unchanged-safe
          - intended-safe-change
          - new-policy-violation
          - pre-existing-violation
          - inconclusive
          title: Classification
        executions:
          items:
            $ref: '#/components/schemas/Execution'
          type: array
          title: Executions
      additionalProperties: false
      type: object
      required:
      - case_id
      - classification
      - executions
      title: CaseEvidence
    Check:
      properties:
        code:
          type: string
          title: Code
        passed:
          type: boolean
