# Render blueprint for the review UI (static site).
# In Render: New > Blueprint, pick this repo, and set the blueprint path to frontend/render.yaml.
services:
  - type: web
    runtime: static
    name: membrane-review
    branch: feat/membrane-review-ui
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Origin of the hosted backend, e.g. https://membrane-api.onrender.com
      # Leave empty to demo the screen in synthetic mode (?synthetic=1).
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
